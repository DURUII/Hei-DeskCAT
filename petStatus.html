<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Pet Status</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .status-popup {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid #eee;
            width: 200px;
            text-align: center;
            animation: fadeIn 0.3s ease-out;
        }

        .status-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }

        .status-message {
            font-size: 14px;
            color: #666;
            margin: 5px 0;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            to {
                opacity: 0;
                transform: translateY(-10px) scale(0.95);
            }
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in forwards;
        }
    </style>
</head>

<body>
    <div class="status-popup" id="statusPopup">
        <div class="status-title">小旅星状态</div>
        <div class="status-message" id="statusMessage">正在冰岛看极光✨</div>
        <div class="status-message">预计还有15小时到达</div>
    </div>

    <script>
        try {
            const { ipcRenderer } = require('electron');
            const statusMessage = document.getElementById('statusMessage');
            const statusPopup = document.getElementById('statusPopup');

            console.log('Pet status window script loaded successfully');

            // 监听主进程发送的状态消息
            ipcRenderer.on('update-status-message', (event, message) => {
                console.log('Received status message:', message);
                if (statusMessage) {
                    statusMessage.textContent = message;
                }
            });

            // 2.5秒后开始淡出动画
            setTimeout(() => {
                if (statusPopup) {
                    statusPopup.classList.add('fade-out');
                }
            }, 2500);

            // 点击窗口关闭
            document.addEventListener('click', () => {
                console.log('Window clicked, closing...');
                window.close();
            });

            // ESC键关闭
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    console.log('ESC pressed, closing...');
                    window.close();
                }
            });

            console.log('Event listeners added successfully');
        } catch (error) {
            console.error('Error in pet status window script:', error);
            // 如果出错，显示默认消息
            const statusMessage = document.getElementById('statusMessage');
            if (statusMessage) {
                statusMessage.textContent = '正在旅行中...';
            }
        }
    </script>
</body>

</html>
