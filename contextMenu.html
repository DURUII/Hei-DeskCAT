<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Context Menu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-app-region: no-drag;
        }

        .context-menu {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 8px 0;
            min-width: 150px;
            -webkit-app-region: no-drag;
        }

        .context-menu-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .context-menu-item:hover {
            background-color: #f5f5f5;
        }

        .context-menu-item.danger {
            color: #e74c3c;
        }

        .context-menu-item.danger:hover {
            background-color: #fdf2f2;
        }

        .context-menu-separator {
            height: 1px;
            background-color: #eee;
            margin: 4px 0;
        }

        /* 淡出动画 */
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in forwards;
        }
    </style>
</head>

<body>
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" id="openMainWindow">
            <span>🏠</span>
            <span>打开主页面</span>
        </div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item danger" id="exitApp">
            <span>🚪</span>
            <span>退出应用</span>
        </div>
    </div>

    <script>
        try {
            const { ipcRenderer } = require('electron');
            const openMainWindow = document.getElementById('openMainWindow');
            const exitApp = document.getElementById('exitApp');
            const contextMenu = document.getElementById('contextMenu');

            console.log('Context menu window script loaded successfully');

            // 自动关闭功能（4.5秒后开始淡出，5秒后关闭）
            setTimeout(() => {
                if (contextMenu) {
                    contextMenu.classList.add('fade-out');
                }
            }, 4500);

            // 打开主页面
            openMainWindow.addEventListener('click', () => {
                console.log('Opening main window from context menu');
                try {
                    ipcRenderer.send('open-main-window');
                    window.close();
                } catch (error) {
                    console.error('Error opening main window:', error);
                }
            });

            // 退出应用
            exitApp.addEventListener('click', () => {
                console.log('Exiting app from context menu');
                try {
                    ipcRenderer.send('exit-app');
                    window.close();
                } catch (error) {
                    console.error('Error exiting app:', error);
                }
            });

            // 点击其他地方关闭菜单
            document.addEventListener('click', (e) => {
                // 如果点击的是body（背景）或者不是菜单项，则关闭菜单
                if (e.target === document.body || !e.target.closest('.context-menu-item')) {
                    console.log('Click outside menu, closing...');
                    window.close();
                }
            });

            // 监听窗口失去焦点时关闭
            window.addEventListener('blur', () => {
                console.log('Window lost focus, closing...');
                window.close();
            });

            // ESC键关闭
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    window.close();
                }
            });

            // 窗口关闭时通知主进程清理全局变量
            window.addEventListener('beforeunload', () => {
                try {
                    ipcRenderer.send('context-menu-closed');
                } catch (error) {
                    console.error('Error notifying context menu close:', error);
                }
            });

            // 鼠标悬停时重置自动关闭计时器
            let autoCloseTimer;
            const resetAutoClose = () => {
                if (autoCloseTimer) {
                    clearTimeout(autoCloseTimer);
                }
                autoCloseTimer = setTimeout(() => {
                    if (contextMenu) {
                        contextMenu.classList.add('fade-out');
                    }
                }, 4500);
            };

            // 监听鼠标进入和离开
            contextMenu.addEventListener('mouseenter', () => {
                if (contextMenu.classList.contains('fade-out')) {
                    contextMenu.classList.remove('fade-out');
                }
                resetAutoClose();
            });

            contextMenu.addEventListener('mouseleave', () => {
                resetAutoClose();
            });

            console.log('Context menu event listeners added successfully');
        } catch (error) {
            console.error('Error in context menu window script:', error);
        }
    </script>
</body>

</html>
