<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>DeskPet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-app-region: drag;
            /* 添加拖动区域 */
        }

        .pet-container {
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-app-region: no-drag;
            /* 点击区域不拖动 */
            position: fixed;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            /* 初始位置在右下角 */
            right: 20px;
            bottom: 20px;
        }

        .pet-container:hover {
            transform: scale(1.1);
        }

        .pet-container:active {
            transform: scale(0.95);
        }

        .pet-image {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
            /* 确保点击事件传递给父容器 */
            user-select: none;
            /* 防止图片被选中 */
        }



        /* 拖拽提示 */
        .pet-container::after {
            content: '↕';
            position: absolute;
            top: -15px;
            right: -15px;
            font-size: 12px;
            color: #999;
            pointer-events: none;
            opacity: 0.6;
        }

        /* 吸附动画 */
        @keyframes snap-bounce {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes snap-scale {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        /* 返回动画 */
        @keyframes return-walk {
            0% {
                transform: scale(1) translateX(0);
            }

            25% {
                transform: scale(1.1) translateX(-5px);
            }

            50% {
                transform: scale(1) translateX(0);
            }

            75% {
                transform: scale(1.1) translateX(5px);
            }

            100% {
                transform: scale(1) translateX(0);
            }
        }
    </style>
</head>

<body>
    <div class="pet-container" id="pet">
        <img class="pet-image" id="petImage" src="assets/imgs/罗小黑的生活/pet.gif" alt="桌宠" />
    </div>



    <script>
        const pet = document.getElementById('pet');
        const petImage = document.getElementById('petImage');

        // 表情映射表
        const emotionMap = {
            '好棒': 'assets/imgs/罗小黑的生活/好棒.gif',
            '嘿嘿被夸了': 'assets/imgs/罗小黑的生活/嘿嘿被夸了.gif',
            '给你花花': 'assets/imgs/罗小黑的生活/给你花花.gif',
            '有瓜让我听听': 'assets/imgs/罗小黑的生活/有瓜让我听听.gif',
            '猫头偷看': 'assets/imgs/罗小黑的生活/猫头偷看.gif',
            '思考并怀疑': 'assets/imgs/罗小黑的生活/思考并怀疑.gif',
            '好复杂': 'assets/imgs/罗小黑的生活/好复杂.gif',
            '馋得流口水': 'assets/imgs/罗小黑的生活/馋得流口水.gif',
            '生气替你出头': 'assets/imgs/罗小黑的生活/生气替你出头.gif',
            '哼不理你了': 'assets/imgs/罗小黑的生活/哼不理你了.gif',
            '玩手机': 'assets/imgs/罗小黑的生活/玩手机.gif',
            '困死了': 'assets/imgs/罗小黑的生活/困死了.gif'
        };

        // 根据时间切换默认表情
        function updateDefaultEmotion() {
            const now = new Date();
            const hour = now.getHours();

            if (hour >= 18) { // 晚上6点后
                petImage.src = 'assets/imgs/罗小黑的生活/困死了.gif';
                console.log('晚上时间，切换到困死了.gif');
            } else {
                petImage.src = 'assets/imgs/罗小黑的生活/pet.gif'; // 默认的 so hot
                console.log('白天时间，使用默认pet.gif');
            }
        }

        // 切换表情函数
        function changeEmotion(emotion) {
            if (emotionMap[emotion]) {
                petImage.src = emotionMap[emotion];
                console.log('切换到表情:', emotion);
            } else {
                console.log('未知表情:', emotion);
            }
        }

        // 初始化时设置默认表情
        updateDefaultEmotion();

        // 右键菜单功能
        let contextMenuTimeout = null;
        pet.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // 防抖：清除之前的超时
            if (contextMenuTimeout) {
                clearTimeout(contextMenuTimeout);
            }

            // 延迟发送，避免快速连续点击
            contextMenuTimeout = setTimeout(() => {
                try {
                    console.log('Sending context menu request');
                    require('electron').ipcRenderer.send('show-context-menu', e.screenX, e.screenY);
                } catch (error) {
                    console.error('Error showing context menu:', error);
                }
            }, 50);
        });

        // 左键点击功能（非拖拽时）
        pet.addEventListener('click', (e) => {
            // 只有在没有拖拽的情况下才触发点击
            if (!isDragging) {
                console.log('Pet clicked');
                // 这里可以添加点击宠物时的其他功能
            } else {
                console.log('Click ignored during dragging');
            }
        });

        // 拖拽功能 - 优化后的跟手拖拽
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0; // 上一次鼠标位置
        let offsetX, offsetY; // 鼠标在窗口内的偏移位置
        let lastMoveTime = 0; // 上次移动时间
        const moveThreshold = 1; // 移动阈值（像素）
        let isFlipped = false; // 记录翻转状态

        // 整个宠物容器都可以拖拽
        pet.addEventListener('mousedown', (e) => {
            // 只有左键拖拽
            if (e.button !== 0) return;

            e.preventDefault(); // 防止默认行为
            isDragging = true;

            // 记录鼠标在窗口内的点击位置
            offsetX = e.clientX;
            offsetY = e.clientY;

            // 记录当前鼠标屏幕位置
            lastMouseX = e.screenX;
            lastMouseY = e.screenY;
            lastMoveTime = Date.now();

            // 开始拖拽时重置翻转状态
            if (isFlipped) {
                isFlipped = false;
                pet.style.transform = 'scale(1)';
                console.log('拖拽开始，重置翻转状态');
            }

            pet.style.cursor = 'grabbing';

            // 通知主进程开始拖动，并传递偏移量
            try {
                require('electron').ipcRenderer.send('drag-start', { offsetX, offsetY });
            } catch (error) {
                console.error('发送拖动开始信号失败:', error);
            }

            console.log('开始拖拽宠物');
        });

        // 鼠标移动事件
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            // 计算鼠标移动距离
            const deltaX = e.screenX - lastMouseX;
            const deltaY = e.screenY - lastMouseY;

            // 检查是否移动超过阈值，并且最小时间间隔
            const now = Date.now();
            const timeDelta = now - lastMoveTime;

            if ((Math.abs(deltaX) > moveThreshold || Math.abs(deltaY) > moveThreshold) && timeDelta > 16) {
                // 更新上次移动时间
                lastMoveTime = now;

                // 更新上次鼠标位置
                lastMouseX = e.screenX;
                lastMouseY = e.screenY;

                // 直接发送鼠标的绝对位置给主进程
                try {
                    require('electron').ipcRenderer.send('move-pet-absolute', {
                        mouseX: e.screenX,
                        mouseY: e.screenY
                    });
                } catch (error) {
                    console.error('发送鼠标位置失败:', error);
                }
            }
        });

        // 鼠标释放事件
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                console.log('结束拖拽宠物');
                isDragging = false;
                pet.style.cursor = 'pointer';

                // 通知主进程结束拖动
                try {
                    require('electron').ipcRenderer.send('drag-end');
                } catch (error) {
                    console.error('发送拖拽结束信号失败:', error);
                }
            }
        });

        // 确保鼠标离开窗口时也能正确处理拖动结束
        document.addEventListener('mouseleave', () => {
            if (isDragging) {
                console.log('鼠标离开窗口，结束拖拽');
                isDragging = false;
                pet.style.cursor = 'pointer';

                // 通知主进程结束拖动
                try {
                    require('electron').ipcRenderer.send('drag-end');
                } catch (error) {
                    console.error('发送拖拽结束信号失败:', error);
                }
            }
        });

        // 防止拖拽时选中文本
        pet.addEventListener('selectstart', (e) => {
            if (isDragging) {
                e.preventDefault();
            }
        });

        // 监听窗口位置更新（保留用于其他功能）
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('pet-window-position', (event, x, y) => {
            // 保留此监听器用于其他功能，但不再用于拖动
        });

        // 监听边缘吸附完成事件
        ipcRenderer.on('snap-completed', (event, x, y, snapType, shouldFlip) => {
            console.log('边缘吸附完成:', x, y, snapType, shouldFlip);

            // 更新本地窗口位置记录（如果需要的话）
            // windowStartPos = { x, y }; // 已移除，不再需要

            // 处理翻转
            if (shouldFlip) {
                isFlipped = true;
                pet.style.transform = 'scaleY(-1)';
                console.log('宠物已翻转（吸附到顶部）');
            } else {
                isFlipped = false;
            }

            // 添加吸附完成的视觉反馈和动画
            pet.style.transform = shouldFlip ? 'scale(1.1) scaleY(-1)' : 'scale(1.1)';
            pet.style.transition = 'transform 0.2s ease-out';

            // 吸附动画效果
            if (snapType.includes('的')) {
                // 窗口吸附：添加弹跳动画
                pet.style.animation = 'snap-bounce 0.6s ease-out';
            } else {
                // 屏幕边缘吸附：添加缩放动画
                pet.style.animation = 'snap-scale 0.4s ease-out';
            }

            // 显示吸附类型提示
            showSnapTip(snapType);

            setTimeout(() => {
                pet.style.transform = shouldFlip ? 'scale(1) scaleY(-1)' : 'scale(1)';
                pet.style.transition = 'transform 0.1s ease-in';
                pet.style.animation = '';
            }, 200);
        });

        // 监听返回原位置事件
        ipcRenderer.on('return-to-original', (event) => {
            console.log('开始返回原位置');

            // 重置翻转状态
            if (isFlipped) {
                isFlipped = false;
                pet.style.transform = 'scale(1)';
            }

            // 显示返回提示
            showReturnTip();

            // 添加返回动画效果
            pet.style.animation = 'return-walk 1s ease-in-out';
        });

        // 监听返回完成事件
        ipcRenderer.on('return-completed', (event) => {
            console.log('返回原位置完成');

            // 清除动画
            pet.style.animation = '';

            // 显示返回完成提示
            showReturnCompletedTip();
        });

        // 显示吸附提示的函数
        function showSnapTip(type) {
            // 移除已存在的提示
            const existingTip = document.querySelector('.snap-tip');
            if (existingTip) {
                existingTip.remove();
            }

            // 创建提示元素
            const tip = document.createElement('div');
            tip.className = 'snap-tip';
            tip.textContent = `已吸附到${type}`;

            // 根据吸附类型设置不同的颜色
            let tipColor = 'rgba(0, 0, 0, 0.8)';
            if (type.includes('的')) {
                // 窗口边缘吸附用蓝色
                tipColor = 'rgba(0, 100, 200, 0.9)';
            } else if (type.includes('上边缘') || type.includes('上角')) {
                // 顶部吸附用橙色（翻转提示）
                tipColor = 'rgba(255, 140, 0, 0.9)';
            }

            tip.style.cssText = `
                position: absolute;
                top: -30px;
                left: 50%;
                transform: translateX(-50%);
                background: ${tipColor};
                color: white;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                white-space: nowrap;
                z-index: 1000;
                opacity: 0;
                transition: opacity 0.3s ease;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            `;

            pet.appendChild(tip);

            // 显示提示
            setTimeout(() => {
                tip.style.opacity = '1';
            }, 10);

            // 3秒后隐藏提示
            setTimeout(() => {
                tip.style.opacity = '0';
                setTimeout(() => {
                    if (tip.parentNode) {
                        tip.remove();
                    }
                }, 300);
            }, 3000);
        }

        // 显示返回提示的函数
        function showReturnTip() {
            const existingTip = document.querySelector('.return-tip');
            if (existingTip) {
                existingTip.remove();
            }

            const tip = document.createElement('div');
            tip.className = 'return-tip';
            tip.textContent = '窗口已关闭，正在返回原位置...';
            tip.style.cssText = `
                position: absolute;
                top: -30px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(255, 0, 0, 0.9);
                color: white;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                white-space: nowrap;
                z-index: 1000;
                opacity: 0;
                transition: opacity 0.3s ease;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            `;

            pet.appendChild(tip);

            setTimeout(() => {
                tip.style.opacity = '1';
            }, 10);
        }

        // 显示返回完成提示的函数
        function showReturnCompletedTip() {
            const existingTip = document.querySelector('.return-tip');
            if (existingTip) {
                existingTip.remove();
            }

            const tip = document.createElement('div');
            tip.className = 'return-completed-tip';
            tip.textContent = '已返回原位置';
            tip.style.cssText = `
                position: absolute;
                top: -30px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 128, 0, 0.9);
                color: white;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                white-space: nowrap;
                z-index: 1000;
                opacity: 0;
                transition: opacity 0.3s ease;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            `;

            pet.appendChild(tip);

            setTimeout(() => {
                tip.style.opacity = '1';
            }, 10);

            setTimeout(() => {
                tip.style.opacity = '0';
                setTimeout(() => {
                    if (tip.parentNode) {
                        tip.remove();
                    }
                }, 300);
            }, 2000);
        }

        // 监听表情切换事件
        try {
            require('electron').ipcRenderer.on('change-emotion', (event, emotion) => {
                changeEmotion(emotion);
            });
        } catch (error) {
            console.error('Error setting up emotion listener:', error);
        }

        console.log('Pet with drag and emotion support loaded');
    </script>
</body>

</html>
