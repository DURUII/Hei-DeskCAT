<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>DeskPet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-app-region: drag;
            /* 添加拖动区域 */
        }

        .pet-container {
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-app-region: no-drag;
            /* 点击区域不拖动 */
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
        }

        .pet-container:hover {
            transform: scale(1.1);
        }

        .pet-container:active {
            transform: scale(0.95);
        }

        .pet-image {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
            /* 确保点击事件传递给父容器 */
            user-select: none;
            /* 防止图片被选中 */
        }



        /* 拖动手柄 */
        .drag-handle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            -webkit-app-region: drag;
            cursor: move;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="drag-handle" id="dragHandle"></div>
    <div class="pet-container" id="pet">
        <img class="pet-image" src="images/pet.gif" alt="桌宠" />
    </div>



    <script>
        const pet = document.getElementById('pet');
        const dragHandle = document.getElementById('dragHandle');

        // 右键菜单功能
        let contextMenuTimeout = null;
        pet.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // 防抖：清除之前的超时
            if (contextMenuTimeout) {
                clearTimeout(contextMenuTimeout);
            }

            // 延迟发送，避免快速连续点击
            contextMenuTimeout = setTimeout(() => {
                try {
                    console.log('Sending context menu request');
                    require('electron').ipcRenderer.send('show-context-menu', e.screenX, e.screenY);
                } catch (error) {
                    console.error('Error showing context menu:', error);
                }
            }, 50);
        });

        // 宠物动画已通过GIF实现，无需代码控制
        console.log('Pet animation loaded from GIF file');


    </script>
</body>

</html>
