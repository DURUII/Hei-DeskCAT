<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>旅行完成</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .completion-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            -webkit-app-region: drag;
            animation: slideIn 0.6s ease-out;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .completion-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-10px);
            }

            60% {
                transform: translateY(-5px);
            }
        }

        .completion-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .completion-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .journey-info {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .journey-route {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .journey-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .weather-info {
            background: rgba(255, 193, 7, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            border-left: 4px solid #ffc107;
        }

        .weather-text {
            font-size: 14px;
            color: #333;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-app-region: no-drag;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            transition: all 0.3s ease;
            -webkit-app-region: no-drag;
            z-index: 1000;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 1);
            color: #333;
            transform: scale(1.1);
        }

        .photo-gallery {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .photo-item {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            animation: photoAppear 0.5s ease-out;
        }

        @keyframes photoAppear {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(180deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .photo-item:nth-child(1) {
            animation-delay: 0.1s;
        }

        .photo-item:nth-child(2) {
            animation-delay: 0.2s;
        }

        .photo-item:nth-child(3) {
            animation-delay: 0.3s;
        }

        .photo-item:nth-child(4) {
            animation-delay: 0.4s;
        }

        .photo-item:nth-child(5) {
            animation-delay: 0.5s;
        }
    </style>
</head>

<body>
    <div class="completion-container">
        <button class="close-btn" id="closeBtn">×</button>
        <div class="completion-icon">🎉</div>
        <div class="completion-title">旅行完成！</div>
        <div class="completion-subtitle">恭喜你完成了一次精彩的云旅行</div>

        <div class="journey-info">
            <div class="journey-route" id="journeyRoute">武汉光谷 → 北京天安门</div>
            <div class="journey-stats">
                <div class="stat-item">
                    <div class="stat-value" id="distance">0</div>
                    <div class="stat-label">公里</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="duration">0</div>
                    <div class="stat-label">小时</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgSpeed">0</div>
                    <div class="stat-label">km/h</div>
                </div>
            </div>
        </div>

        <div class="weather-info">
            <div class="weather-text" id="weatherInfo">🌤️ 目的地天气晴朗，温度适宜</div>
        </div>

        <div class="photo-gallery" id="photoGallery">
            <div class="photo-item">📸</div>
            <div class="photo-item">🏛️</div>
            <div class="photo-item">🌅</div>
            <div class="photo-item">🍜</div>
            <div class="photo-item">🎭</div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="newJourneyBtn">开始新旅行</button>
            <button class="btn btn-secondary" id="viewMapBtn">查看地图</button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // 获取DOM元素
        const closeBtn = document.getElementById('closeBtn');
        const newJourneyBtn = document.getElementById('newJourneyBtn');
        const viewMapBtn = document.getElementById('viewMapBtn');
        const journeyRoute = document.getElementById('journeyRoute');
        const distance = document.getElementById('distance');
        const duration = document.getElementById('duration');
        const avgSpeed = document.getElementById('avgSpeed');
        const weatherInfo = document.getElementById('weatherInfo');

        // 关闭窗口
        closeBtn.addEventListener('click', () => {
            ipcRenderer.send('close-travel-complete');
        });

        // 开始新旅行
        newJourneyBtn.addEventListener('click', () => {
            // 获取AI识别到的新目的地（如果有的话）
            const newDestination = window.aiNewDestination || null;
            ipcRenderer.send('start-new-journey', newDestination);
        });

        // 查看地图
        viewMapBtn.addEventListener('click', () => {
            ipcRenderer.send('view-journey-map');
        });

        // 监听旅行完成数据
        ipcRenderer.on('travel-complete-data', (event, data) => {
            console.log('Received travel complete data:', data);

            // 更新界面信息
            if (data.route) {
                journeyRoute.textContent = `${data.route.origin} → ${data.route.destination}`;
            }

            if (data.summary) {
                distance.textContent = data.summary.distance.toFixed(1);
                duration.textContent = data.summary.duration.toFixed(1);
                avgSpeed.textContent = data.summary.avgSpeed;
            }

            if (data.weather) {
                const weather = data.weather;
                weatherInfo.textContent = `${weather.emoji || '🌤️'} ${weather.city} ${weather.description}，${weather.temperature}°C`;
            }

            // 保存AI识别到的新目的地（如果有的话）
            if (data.newDestination) {
                window.aiNewDestination = data.newDestination;
                console.log('Saved new destination for restart:', data.newDestination);
            }
        });

        // 自动关闭倒计时
        let autoCloseTimer = setTimeout(() => {
            ipcRenderer.send('close-travel-complete');
        }, 30000); // 30秒后自动关闭

        // 用户交互时重置倒计时
        document.addEventListener('click', () => {
            clearTimeout(autoCloseTimer);
            autoCloseTimer = setTimeout(() => {
                ipcRenderer.send('close-travel-complete');
            }, 30000);
        });

        console.log('Travel complete window loaded');
    </script>
</body>

</html>
