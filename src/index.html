<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>HeiDeskCat - 让小黑做你的上班搭子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #f0f8ff 50%, #e6f7ff 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2c5aa0;
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰元素 */
        .bg-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            animation: float 6s ease-in-out infinite;
        }

        .cloud-1 {
            width: 80px;
            height: 40px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .cloud-2 {
            width: 60px;
            height: 30px;
            top: 20%;
            right: 15%;
            animation-delay: 2s;
        }

        .cloud-3 {
            width: 100px;
            height: 50px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 标题区域 */
        .title-section {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            filter: drop-shadow(0 4px 8px rgba(74, 108, 247, 0.3));
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .title-content {
            text-align: left;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #2c5aa0;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(44, 90, 160, 0.2);
        }

        .subtitle {
            font-size: 16px;
            color: #5a7c9a;
            line-height: 1.5;
            font-weight: 400;
        }

        /* 状态指示器 */
        .status-indicator {
            background: linear-gradient(135deg, #4a6cf7 0%, #6b8cff 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.3);
            margin-bottom: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-indicator::before {
            content: "✨";
            font-size: 16px;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* 功能卡片区域 - 2x2网格 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 15px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid rgba(74, 108, 247, 0.1);
            box-shadow: 0 8px 25px rgba(74, 108, 247, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(74, 108, 247, 0.1), transparent);
            transition: left 0.5s;
        }

        .feature-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(74, 108, 247, 0.2);
            border-color: rgba(74, 108, 247, 0.3);
        }

        .feature-card:hover::before {
            left: 100%;
        }

        .feature-icon {
            font-size: 28px;
            margin-bottom: 12px;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(74, 108, 247, 0.3));
        }

        .feature-title {
            font-size: 15px;
            font-weight: 600;
            color: #2c5aa0;
            margin-bottom: 6px;
        }

        .feature-desc {
            font-size: 13px;
            color: #5a7c9a;
            line-height: 1.4;
        }

        .sensitive-warning {
            color: #ff6b6b;
            font-weight: 500;
            font-size: 11px;
            margin-top: 4px;
            display: block;
        }

        /* 快捷操作区域 */
        .controls-section {
            margin-bottom: 30px;
        }

        .controls-section h3 {
            color: #2c5aa0;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .controls-grid {
            display: flex;
            gap: 12px;
            max-width: 700px;
            margin: 0 auto;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(135deg, #4a6cf7 0%, #6b8cff 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.3);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(74, 108, 247, 0.4);
        }

        .control-btn:hover::before {
            left: 100%;
        }

        .control-btn:active {
            transform: translateY(-1px);
        }

        /* 使用说明区域 */
        .instructions-section {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(74, 108, 247, 0.1);
            border-radius: 20px;
            padding: 20px;
            max-width: 600px;
            box-shadow: 0 8px 25px rgba(74, 108, 247, 0.1);
        }

        .instructions-section h3 {
            color: #2c5aa0;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instructions-section h3::before {
            content: "📖";
            font-size: 20px;
        }

        .instructions-list {
            list-style: none;
            text-align: left;
        }

        .instructions-list li {
            margin-bottom: 10px;
            padding-left: 25px;
            position: relative;
            color: #5a7c9a;
            line-height: 1.5;
            font-size: 14px;
        }

        .instructions-list li::before {
            content: "🌟";
            position: absolute;
            left: 0;
            top: 0;
            font-size: 14px;
        }

        .instructions-list strong {
            color: #2c5aa0;
            font-weight: 600;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-container {
                padding: 20px 15px;
                min-height: auto;
            }

            .title-section {
                flex-direction: column;
                text-align: center;
                gap: 15px;
                margin-bottom: 25px;
            }

            .title-content {
                text-align: center;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            .logo {
                width: 50px;
                height: 50px;
            }

            .status-indicator {
                padding: 8px 20px;
                font-size: 13px;
                margin-bottom: 25px;
            }

            .features-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-bottom: 25px;
            }

            .feature-card {
                padding: 15px 12px;
            }

            .controls-grid {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .control-btn {
                width: 100%;
                max-width: 300px;
                padding: 10px 18px;
                font-size: 12px;
            }

            .instructions-section {
                padding: 15px 12px;
            }

            .instructions-list li {
                font-size: 13px;
                margin-bottom: 8px;
            }
        }

        /* 加载动画 */
        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80%,
            100% {
                content: '...';
            }
        }
    </style>
</head>

<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="floating-cloud cloud-1"></div>
        <div class="floating-cloud cloud-2"></div>
        <div class="floating-cloud cloud-3"></div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-container">
        <!-- 标题区域 -->
        <div class="title-section">
            <img class="logo" src="assets/imgs/罗小黑的生活/pet.gif" alt="小黑" />
            <div class="title-content">
                <h1>HeiDeskCat</h1>
                <p class="subtitle">让小黑做你的上班搭子 ✨</p>
            </div>
        </div>

        <!-- 状态指示器 -->
        <div class="status-indicator">
            ✨ 小黑已上线，准备陪伴你的每一天！✨
        </div>

        <!-- 功能卡片 - 2x2网格 -->
        <div class="features-grid">
            <div class="feature-card">
                <span class="feature-icon">📸</span>
                <div class="feature-title">智能截图</div>
                <div class="feature-desc">截图即响应，AI帮你分析内容并生成有趣回应
                    <span class="sensitive-warning">⚠️ 请勿截图包含敏感信息的内容</span>
                </div>
            </div>
            <div class="feature-card">
                <span class="feature-icon">⏰</span>
                <div class="feature-title">健康提醒</div>
                <div class="feature-desc">久坐提醒、喝水提醒，小黑关心你的健康</div>
            </div>
            <div class="feature-card">
                <span class="feature-icon">🗺️</span>
                <div class="feature-title">云旅行</div>
                <div class="feature-desc">足不出户，和小黑一起云游世界</div>
            </div>
            <div class="feature-card">
                <span class="feature-icon">📝</span>
                <div class="feature-title">智能待办</div>
                <div class="feature-desc">自动识别截图中的待办事项并记录</div>
            </div>
        </div>

        <!-- 快捷操作 -->
        <div class="controls-section">
            <h3>快捷操作</h3>
            <div class="controls-grid">
                <button class="control-btn" id="waterBtn">
                    💧 喝水提醒
                </button>
                <button class="control-btn" id="funBtn">
                    🤸 趣味互动
                </button>
                <button class="control-btn" id="statusBtn">
                    🗺️ 旅行状态
                </button>
                <button class="control-btn" id="todoBtn">
                    📋 待办清单
                </button>
            </div>
        </div>

        <!-- 使用说明 -->
        <div class="instructions-section">
            <h3>使用指南</h3>
            <ul class="instructions-list">
                <li>按 <strong>F2</strong> 键截图，触发小黑的智能分析</li>
                <li>按 <strong>F3</strong> 键手动触发喝水提醒</li>
                <li>按 <strong>F4</strong> 键手动触发趣味提醒</li>
                <li>点击右下角小黑可查看当前状态</li>
                <li>应用会自动检测你的活动状态并提醒</li>
                <li>右键点击小黑可打开更多设置选项</li>
            </ul>
        </div>
    </div>

    <script>
        // 按钮事件处理
        const waterBtn = document.getElementById('waterBtn');
        const funBtn = document.getElementById('funBtn');
        const statusBtn = document.getElementById('statusBtn');
        const todoBtn = document.getElementById('todoBtn');

        console.log('HeiDeskCat界面已加载');

        // 按钮事件
        waterBtn.addEventListener('click', () => {
            // 发送IPC消息触发喝水提醒
            require('electron').ipcRenderer.send('manual-water-reminder');
        });

        funBtn.addEventListener('click', () => {
            // 发送IPC消息触发趣味提醒
            require('electron').ipcRenderer.send('manual-fun-reminder');
        });

        statusBtn.addEventListener('click', () => {
            // 发送IPC消息查看旅程状态
            require('electron').ipcRenderer.send('check-journey-status');
        });

        todoBtn.addEventListener('click', () => {
            // 发送IPC消息打开待办清单
            require('electron').ipcRenderer.send('open-todo-window');
        });

        // 添加页面加载动画
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.feature-card, .control-btn, .instructions-section');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    el.style.transition = 'all 0.6s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });

        // 添加鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const clouds = document.querySelectorAll('.floating-cloud');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            clouds.forEach((cloud, index) => {
                const speed = (index + 1) * 0.5;
                const x = (mouseX - 0.5) * speed * 20;
                const y = (mouseY - 0.5) * speed * 20;
                cloud.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>

</html>
