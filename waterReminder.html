<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>喝水提醒</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .reminder-container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid #eee;
            width: 250px;
        }
        
        .water-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: wave 1s infinite ease-in-out;
        }
        
        .message {
            font-size: 16px;
            color: #333;
            margin: 0 0 15px 0;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .action-button {
            background: #4a6cf7;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            color: white;
        }
        
        .action-button:hover {
            background: #3a5ce5;
            transform: scale(1.05);
        }
        
        .action-button.cancel {
            background: #f0f0f0;
            color: #666;
        }
        
        .action-button.cancel:hover {
            background: #e0e0e0;
        }
        
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .water-svg {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
        }
    </style>
</head>
<body>
    <div class="reminder-container">
        <svg class="water-svg" viewBox="0 0 100 100">
            <path d="M30,20 Q50,5 70,20 Q85,40 70,70 Q50,95 30,70 Q15,40 30,20" fill="#4a6cf7" />
            <path d="M40,30 Q50,20 60,30 Q70,45 60,60 Q50,75 40,60 Q30,45 40,30" fill="#6a8cff" />
        </svg>
        <p class="message">该喝水啦！</p>
        <div class="action-buttons">
            <button class="action-button" id="confirmButton">已喝水</button>
            <button class="action-button cancel" id="laterButton">稍后提醒</button>
        </div>
    </div>
    
    <script>
        const confirmButton = document.getElementById('confirmButton');
        const laterButton = document.getElementById('laterButton');
        
        // 模拟水位随系统音量变化的动效
        function updateWaterLevel() {
            // 这里模拟音量变化，实际应该获取系统音量
            const volume = Math.random(); // 模拟音量 0-1
            
            // 在实际应用中，这里会根据真实音量调整SVG水位
        }
        
        // 定期更新水位显示
        setInterval(updateWaterLevel, 1000);
        
        // 点击确认按钮
        confirmButton.addEventListener('click', () => {
            // 发送确认消息到主进程
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('water-confirmed');
            
            // 关闭窗口
            window.close();
        });
        
        // 点击稍后提醒按钮
        laterButton.addEventListener('click', () => {
            // 发送稍后提醒消息到主进程
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('water-delayed');
            
            // 关闭窗口
            window.close();
        });
        
        // 初始化
        updateWaterLevel();
    </script>
</body>
</html>
